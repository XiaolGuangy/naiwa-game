<head>

<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;background:#05060a;font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;color:#fff5e4}
  body{display:flex;align-items:center;justify-content:center;user-select:none}
  #ambient{position:fixed;inset:0;background:
    radial-gradient(ellipse 60% 50% at 50% 42%, rgba(243,180,92,.07), transparent 65%),
    radial-gradient(ellipse 50% 40% at 80% 80%, rgba(111,203,226,.045), transparent 70%),
    #05060a;
    pointer-events:none}
  #ambient::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse at center,#000 0%,transparent 72%)}
  #wrap{position:relative;width:min(calc(100vw - 24px),calc((100vh - 24px) * 1.7778));aspect-ratio:16/9;max-width:1280px;border-radius:16px;overflow:hidden;background:#0b0c14;box-shadow:0 34px 90px rgba(0,0,0,.72),0 0 0 1px rgba(243,180,92,.22),0 0 80px rgba(243,180,92,.05)}
  #game{display:block;width:100%;height:100%;touch-action:none;cursor:default}
  #wrap::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at center,transparent 56%,rgba(0,0,0,.42) 100%);border-radius:16px}
  #wrap::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:4;opacity:.16;background:repeating-linear-gradient(0deg,rgba(255,255,255,.22) 0px,rgba(255,255,255,.22) 1px,transparent 1px,transparent 3px);border-radius:16px}
  #touchUI{display:none;position:absolute;inset:0;z-index:6;pointer-events:none}
  body.touch #touchUI{display:block}
  .pad{position:absolute;bottom:18px;display:flex;align-items:flex-end;gap:12px;pointer-events:none}
  #padL{left:18px}
  #padR{right:18px}
  .tb{pointer-events:auto;width:62px;height:62px;border-radius:50%;border:1.5px solid rgba(255,245,228,.38);background:rgba(10,11,18,.5);color:#fff5e4;font:700 19px/1 "Microsoft YaHei",sans-serif;backdrop-filter:blur(3px);touch-action:none;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 2px #000;transition:transform .06s,background .06s}
  .tb:active,.tb.on{transform:scale(.92);background:rgba(243,180,92,.30);border-color:#f3b45c}
  .tb.small{width:52px;height:52px;font-size:16px}
  .tb.big{width:72px;height:72px;font-size:22px;border-color:rgba(243,180,92,.55)}
  #pauseBtn{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;font-size:14px;border:1px solid rgba(255,245,228,.28);background:rgba(8,9,15,.45);color:#fff5e4;pointer-events:auto;touch-action:none;z-index:7;opacity:.7}
  #rotate{display:none;position:absolute;inset:0;z-index:9;background:#08090f;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-size:17px;letter-spacing:3px;color:#f3b45c;text-align:center;padding:24px}
  #rotate b{font-size:38px;display:block;color:#fff5e4;letter-spacing:0}
  @media (pointer:coarse) and (orientation:portrait){#rotate{display:flex}}
  @media (max-width:640px){.tb{width:54px;height:54px;font-size:17px}.tb.small{width:46px;height:46px;font-size:14px}.tb.big{width:62px;height:62px;font-size:19px}.pad{bottom:12px;gap:9px}#padL{left:12px}#padR{right:12px}#pauseBtn{width:32px;height:32px;font-size:12px}}
  #padL{left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));width:34%;height:48%;display:block;pointer-events:auto;touch-action:none}
  #moveZone{position:absolute;inset:0;touch-action:none;display:flex;align-items:flex-end;color:rgba(255,245,228,.9);font-size:12px;letter-spacing:1px}
  #moveGuide{display:flex;align-items:center;justify-content:center;width:110px;height:62px;border:1px solid rgba(255,245,228,.38);border-radius:32px;background:rgba(10,11,18,.52);pointer-events:none}
  #moveGuide.active{border-color:#f3b45c;background:rgba(243,180,92,.26)}
  #padR{right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,minmax(48px,60px));grid-template-rows:repeat(2,52px);gap:8px;align-items:center;justify-items:center}
  #padR .tb,#padR .tb.small,#padR .tb.big{width:100%;height:100%;min-width:48px;min-height:48px;font-size:16px}
  #padR .tb.big{font-size:20px;grid-column:3;grid-row:1 / 3;height:100%;border-radius:30px}

<body>
<div id="ambient"></div>
<div id="wrap">
  <canvas id="game" width="960" height="540" aria-label="奶蛙大作战：寒武风云"></canvas>
  <div id="touchUI">
    <div class="pad" id="padL">
      <div id="moveZone" aria-label="左右滑动移动"><div id="moveGuide">◀　滑动移动　▶</div></div>
    </div>
    <div class="pad" id="padR">
      <button class="tb small" data-act="ultimate" aria-label="奶蛙大招">大</button>
      <button class="tb small" data-act="dash" aria-label="冲刺">冲</button>
      <button class="tb small" data-act="skill" aria-label="技能">奶</button>
      <button class="tb" data-act="jump" aria-label="跳跃">跳</button>
      <button class="tb big" data-act="attack" aria-label="攻击">打</button>
    </div>
    <button id="pauseBtn" data-act="pause" aria-label="暂停">Ⅱ</button>
  </div>
  <div id="rotate"><b>↻</b><span>请把手机横过来<br>奶蛙要打人了</span></div>
</div>

<script>
'use strict';
/* =========================================================================
   奶蛙大作战 · 寒武风云
   文亚宇宙同人二创 · 纯虚构 · 无外部依赖
   ========================================================================= */
const W = 960, H = 540, GY = 470;
const CV = document.getElementById('game');
const X = CV.getContext('2d');

const C = {
  ink: '#0b0c14', ink2: '#121421', ink3: '#1a1d2c',
  cream: '#fff5e4', paper: '#efe3cd', gold: '#f3b45c', gold2: '#ffd99a',
  muted: '#9aa0b5', dim: '#62677a', line: 'rgba(243,180,92,.28)',
  red: '#ff6161', pink: '#ff9fb0', blue: '#7fd6e8', mint: '#8be2b0',
  purple: '#b18cff', orange: '#ff9b54', green: '#72c78a',
  hp: '#ff6b6b', mp: '#79d5e8', sun: '#ffd27a',
  shadow: 'rgba(4,4,10,.45)'
};

const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const chance = p => Math.random() < p;
const sign = v => v < 0 ? -1 : 1;
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const approach = (v, target, step) => v < target ? Math.min(v + step, target) : Math.max(v - step, target);
function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function overlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function rectOf(e, shrink = 0) {
  return { x: e.x + shrink, y: e.y + shrink, w: e.w - shrink * 2, h: e.h - shrink * 2 };
}
// 立绘比碰撞框高出头的角色，受击范围按立绘外扩，避免“打头不掉血”。
function hurtBox(e) {
  const p = e && e.hurt;
  if (!p) return e;
  return { x: e.x - p[1], y: e.y - p[0], w: e.w + p[1] * 2, h: e.h + p[0] + (p[2] || 0) };
}
function fmtNum(n) {
  if (n >= 100000) return (n / 10000).toFixed(1) + '万';
  if (n >= 10000) return (n / 10000).toFixed(2) + '万';
  return String(Math.floor(n));
}
function fmtTime(sec) {
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

/* ---------------- 存档 ---------------- */
const SAVE_KEY = 'naiwa_wenyaverse_v1';
const SAVE = { endings: [], muted: false };
try {
  const raw = localStorage.getItem(SAVE_KEY);
  if (raw) {
    const d = JSON.parse(raw);
    if (Array.isArray(d.endings)) SAVE.endings = d.endings.filter(n => n >= 1 && n <= 6);
    if (typeof d.muted === 'boolean') SAVE.muted = d.muted;
  }
} catch (e) { /* 本地存档不可用时静默降级 */ }
function persistSave() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) {}
}
function unlockEnding(id) {
  if (!SAVE.endings.includes(id)) {
    SAVE.endings.push(id);
    SAVE.endings.sort();
    persistSave();
  }
}

/* ---------------- 输入 ---------------- */
const KEYMAP = {
  KeyA: ['left'], ArrowLeft: ['left'],
  KeyD: ['right'], ArrowRight: ['right'],
  KeyW: ['jump', 'up'], ArrowUp: ['jump', 'up'], Space: ['jump', 'confirm'],
  KeyS: ['down'], ArrowDown: ['down'],
  KeyJ: ['attack'], KeyK: ['skill'], KeyL: ['dash'],
  ShiftLeft: ['dash'], ShiftRight: ['dash'],
  Enter: ['confirm'], Escape: ['pause', 'back'], KeyP: ['pause'],
  KeyM: ['mute'], KeyI: ['ultimate'], KeyR: ['reroll'], KeyE: ['interact'],
  Digit1: ['opt1'], Digit2: ['opt2'], Digit3: ['opt3'],
  Digit4: ['opt4'], Digit5: ['opt5'], Digit6: ['opt6'],
  Numpad1: ['opt1'], Numpad2: ['opt2'], Numpad3: ['opt3'],
  Numpad4: ['opt4'], Numpad5: ['opt5'], Numpad6: ['opt6']
};
const Input = {
  down: new Set(), pressed: new Set(),
  mouse: { x: -999, y: -999 },
  init() {
    window.addEventListener('keydown', e => {
      const acts = KEYMAP[e.code];
      if (!acts) return;
      e.preventDefault();
      if (!e.repeat) acts.forEach(a => this.pressed.add(a));
      acts.forEach(a => this.down.add(a));
      Sound.unlock();
      if (e.code === 'Space' && document.activeElement && document.activeElement.blur) {
        if (document.activeElement.tagName === 'BUTTON') document.activeElement.blur();
      }
    });
    window.addEventListener('keyup', e => {
      const acts = KEYMAP[e.code];
      if (acts) acts.forEach(a => this.down.delete(a));
    });
    window.addEventListener('blur', () => { this.down.clear(); this.pressed.clear(); });

    const toLocal = e => {
      const r = CV.getBoundingClientRect();
      return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
    };
    CV.addEventListener('pointermove', e => {
      const p = toLocal(e); this.mouse.x = p.x; this.mouse.y = p.y;
    });
    CV.addEventListener('pointerleave', () => { this.mouse.x = this.mouse.y = -999; });
    CV.addEventListener('pointerdown', e => {
      e.preventDefault();
      Sound.unlock();
      const p = toLocal(e); this.mouse.x = p.x; this.mouse.y = p.y;
      handleCanvasClick(p.x, p.y);
    });

    const moveZone = document.getElementById('moveZone');
    const moveGuide = document.getElementById('moveGuide');
    let movePointer = null, moveStart = 0;
    const stopMove = () => {
      movePointer = null;
      this.down.delete('left'); this.down.delete('right');
      moveGuide.classList.remove('active');
    };
    moveZone.addEventListener('pointerdown', e => {
      if (movePointer !== null) return;
      e.preventDefault(); Sound.unlock();
      movePointer = e.pointerId; moveStart = e.clientX;
      moveGuide.classList.add('active');
      try { moveZone.setPointerCapture(e.pointerId); } catch (_) {}
    });
    moveZone.addEventListener('pointermove', e => {
      if (e.pointerId !== movePointer) return;
      e.preventDefault();
      const dx = e.clientX - moveStart;
      this.down.delete('left'); this.down.delete('right');
      if (Math.abs(dx) >= 10) this.down.add(dx < 0 ? 'left' : 'right');
    });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(type =>
      moveZone.addEventListener(type, e => { if (e.pointerId === movePointer) stopMove(); }));
    window.addEventListener('blur', stopMove);
    document.addEventListener('visibilitychange', () => { if (document.hidden) stopMove(); });

    document.querySelectorAll('.tb').forEach(btn => {
      const act = btn.dataset.act;
      if (!act) return;
      const press = e => {
        e.preventDefault();
        Sound.unlock();
        this.down.add(act); this.pressed.add(act);
        btn.classList.add('on');
        try { btn.setPointerCapture(e.pointerId); } catch (_) {}
      };
      const release = () => { this.down.delete(act); btn.classList.remove('on'); };
      btn.addEventListener('pointerdown', press);
      btn.addEventListener('pointerup', release);
      btn.addEventListener('pointercancel', release);
      btn.addEventListener('lostpointercapture', release);
    });
    const pauseBtn = document.getElementById('pauseBtn');
    if (pauseBtn) {
      pauseBtn.dataset.act = 'pause';
      pauseBtn.setAttribute('aria-label', '暂停');
      pauseBtn.addEventListener('pointerdown', e => {
        e.preventDefault();
        Sound.unlock();
        this.pressed.add('pause');
      });
    }

    if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) {
      document.body.classList.add('touch');
    }
  },
  hit(a) { return this.pressed.has(a); },
  held(a) { return this.down.has(a); },
  clear() { this.pressed.clear(); },
  endFrame() { this.pressed.clear(); }
};

/* ---------------- 合成音频 ---------------- */
const Sound = (() => {
  const SCALES = {
    minor: [0, 2, 3, 5, 7, 8, 10],
    major: [0, 2, 4, 5, 7, 9, 11],
    penta: [0, 2, 4, 7, 9]
  };
  const TRACKS = {
    title: {
      bpm: 72, root: 57, scale: 'minor', chords: [0, 5, 2, 6],
      arp: [0, 2, 4, 7, 4, 2, 0, null], lead: [0, null, 2, 4, null, 4, 2, null],
      leadVol: .052, arpVol: .026, bassVol: .070, drums: [0, 0, 2, 0, 0, 0, 2, 0],
      pad: true, leadType: 'triangle'
    },
    hub: {
      bpm: 88, root: 60, scale: 'major', chords: [0, 5, 3, 4],
      arp: [0, 2, 4, 2, 4, 2, 4, 7], lead: [4, null, 2, 0, null, 2, 4, null],
      leadVol: .040, arpVol: .020, bassVol: .055, drums: [1, 0, 3, 0, 1, 0, 3, 0],
      pad: true, leadType: 'triangle'
    },
    stage: {
      bpm: 140, root: 57, scale: 'minor', chords: [0, 5, 2, 6],
      arp: [0, 2, 4, 2, 0, 4, 7, 4], lead: [7, null, 4, 2, null, 4, 7, null],
      leadVol: .042, arpVol: .023, bassVol: .070, drums: [1, 3, 2, 3, 1, 3, 2, 3],
      pad: false, leadType: 'square'
    },
    boss: {
      bpm: 158, root: 55, scale: 'minor', chords: [0, 0, 5, 6],
      arp: [0, 3, 5, 3, 0, 3, 7, 3], lead: [0, null, 3, 5, null, 5, 3, null],
      leadVol: .046, arpVol: .025, bassVol: .085, drums: [1, 3, 2, 3, 1, 3, 2, 3],
      pad: false, leadType: 'square'
    },
    ending: {
      bpm: 66, root: 53, scale: 'major', chords: [0, 3, 5, 4],
      arp: [0, 2, 4, 7, 4, 2, 0, null], lead: [4, null, 7, null, 2, null, 0, null],
      leadVol: .045, arpVol: .024, bassVol: .050, drums: [0, 0, 3, 0, 0, 0, 3, 0],
      pad: true, leadType: 'triangle'
    },
    betray: {
      bpm: 96, root: 50, scale: 'minor', chords: [0, 5, 2, 6],
      arp: [0, null, 3, null, 5, null, 3, null], lead: [0, null, null, 2, null, null, 3, null],
      leadVol: .038, arpVol: .020, bassVol: .075, drums: [1, 0, 0, 0, 2, 0, 0, 0],
      pad: true, leadType: 'sine'
    }
  };
  const EXTERNAL = {
    dongnan: { src: 'assets/dongnan.mp3?v=8', vol: .42, loop: true },
    victory: { src: 'assets/win_minke.mp3?v=3', vol: .92, loop: true }
  };
  let ac = null, master = null, mBus = null, sBus = null, noiseBuf = null;
  let muted = false, current = null, seqStep = 0, nextT = 0, timer = null;
  let unlocked = false, extEls = {}, extCurrent = null;

  function midi(n) { return 440 * Math.pow(2, (n - 69) / 12); }
  function scaleNote(root, scaleName, degree, oct = 0) {
    const sc = SCALES[scaleName] || SCALES.minor;
    const n = sc.length;
    const o = Math.floor(degree / n);
    const i = ((degree % n) + n) % n;
    return root + (o + oct) * 12 + sc[i];
  }
  function init() {
    if (ac) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      ac = new AC();
      master = ac.createGain();
      master.gain.value = muted ? 0 : .85;
      master.connect(ac.destination);
      mBus = ac.createGain(); mBus.gain.value = .40; mBus.connect(master);
      sBus = ac.createGain(); sBus.gain.value = .55; sBus.connect(master);
      const len = Math.floor(ac.sampleRate * .6);
      noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      nextT = 0;
      timer = setInterval(tick, 80);
    } catch (e) { ac = null; }
  }
  function extEl(name) {
    if (extEls[name]) return extEls[name];
    const cfg = EXTERNAL[name];
    if (!cfg) return null;
    const el = document.createElement('audio');
    el.src = cfg.src;
    el.preload = 'auto';
    el.loop = !!cfg.loop;
    el.volume = muted ? 0 : cfg.vol;
    el.setAttribute('playsinline', '');
    extEls[name] = el;
    return el;
  }
  function playExt(name, restart = false) {
    const cfg = EXTERNAL[name];
    if (!cfg) return;
    const el = extEl(name);
    if (!el) return;
    const changed = extCurrent !== name;
    if (changed && extCurrent) pauseExt();
    el.loop = !!cfg.loop;
    el.volume = muted ? 0 : cfg.vol;
    if (restart || changed) { try { el.currentTime = 0; } catch (e) {} }
    extCurrent = name;
    if (!el.paused) return;
    const pr = el.play();
    if (pr && pr.catch) pr.catch(() => {});
  }
  function pauseExt() {
    if (!extCurrent) return;
    const el = extEls[extCurrent];
    if (el) { try { el.pause(); } catch (e) {} }
    extCurrent = null;
  }
  function unlock() {
    unlocked = true;
    init();
    if (ac && ac.state === 'suspended') ac.resume().catch(() => {});
    if (ac) nextT = 0;
    if (extCurrent) playExt(extCurrent);
  }
  function setMuted(v) {
    muted = !!v;
    SAVE.muted = muted;
    persistSave();
    if (master) master.gain.value = muted ? 0 : .85;
    if (!muted) nextT = 0;
    for (const name in EXTERNAL) {
      const el = extEls[name];
      if (el) el.volume = muted ? 0 : EXTERNAL[name].vol;
    }
    if (!muted && extCurrent) playExt(extCurrent);
  }
  function isMuted() { return muted; }
  function music(name) {
    if (extCurrent && extCurrent !== name) pauseExt();
    if (EXTERNAL[name]) {
      current = null;
      playExt(name);
      return;
    }
    current = name;
    seqStep = 0;
    nextT = 0;
  }
  function restartMusic(name) {
    if (EXTERNAL[name]) {
      current = null;
      if (extCurrent && extCurrent !== name) pauseExt();
      playExt(name, true);
      return;
    }
    music(name);
  }
  function stopMusic() {
    pauseExt();
    current = null;
  }
  function duckMusic(seconds) {
    if (!mBus || !ac) return;
    const t = ac.currentTime;
    const g = mBus.gain;
    try {
      g.cancelScheduledValues(t);
      g.setValueAtTime(Math.max(.02, g.value), t);
      g.linearRampToValueAtTime(.10, t + .12);
      g.setValueAtTime(.10, t + seconds);
      g.linearRampToValueAtTime(.40, t + seconds + .4);
    } catch (e) {}
  }
  function unduckMusic() {
    if (!mBus || !ac) return;
    const t = ac.currentTime;
    const g = mBus.gain;
    try {
      g.cancelScheduledValues(t);
      g.setValueAtTime(Math.max(.02, g.value), t);
      g.linearRampToValueAtTime(.40, t + .3);
    } catch (e) {}
  }

  function tone(type, freq, t, dur, vol, dest, slideTo) {
    if (!ac || !dest) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(Math.max(20, freq), t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);

function updateBoss(e, dt) {

  e.hitFlash = Math.max(0, e.hitFlash - dt);
  const dx = (p.x + p.w / 2) - (e.x + e.w / 2);

    const swoop = cyc > 2.7 ? 132 * Math.sin((cyc - 2.7) / 1.7 * Math.PI) : 0;
    const hover = GY - e.h - 96 + Math.sin(e.floatT * 1.9) * 14;
    const top = e.chargeT > 0 ? GY - e.h - 2 : Math.min(GY - e.h, hover + swoop);

    clampArena(e);
    e.x = clamp(e.x, 30, G.level.width - e.w - 30);
    if (e.chargeT <= 0) { e.state = 'recover'; e.stateT = .8; e.atkCd = e.cd || 1.1; e.armor = false; }
    return;
  }
  e.atkCd -= dt;
  if (e.state === 'windup') {
    e.stateT -= dt; e.vx = approach(e.vx, 0, 1600 * dt);
    if (e.stateT <= 0) {

    }

  } else {
    if (e.kind === 'bi' && Math.random() < dt * .5) addDanmaku(pick(['黑体生物，黑体生物！', '美国大学，美国大学……', '河沙、河沙（自动消音）', '这期的标题我都想好了']));

    else if (dist < want - 50) e.vx = approach(e.vx, -dir * e.speed * .8, 700 * dt);

      e.stateT = ['beam', 'phoneArray', 'survey', 'broadcast', 'solar'].includes(e.pattern) ? .95 : .72;
      e.windup = e.stateT;
      e.warnX = p.x + p.w / 2;
      e.attackCount++;
      e.armor = e.exposedT <= 0;
      Sound.sfx('ui');
    }
  }
  e.x += e.vx * dt;
  e.x = clamp(e.x, 30, G.level.width - e.w - 30);
  clampArena(e);
  if (!e.fly && e.y + e.h < GY) { e.vy += GRAV * dt; e.y = Math.min(GY - e.h, e.y + e.vy * dt); }

      fxRing(e.x + e.w / 2, e.y + e.h * .5, 'rgba(201,162,255,.7)', 70, 320);
      Sound.sfx('dash');
      break;
    case 'ink':
      for (let i = 0; i < 5; i++) {
        G.shots.push({ type: 'ink', x: clamp(p.x + rnd(-120, 120), 30, G.level.width - 30), y: -rnd(0, 60), vx: 0, vy: 240, r: 13, dmg: e.dmg - 4, friendly: false, life: 3, grav: 220 });
      }
      break;
    case 'dash':
      e.chargeT = .38; e.vx = e.face * 540; e.chargeHit = false;
      break;
  }
}

/* ---------------- 子弹 ---------------- */
function updateShots(dt) {
  const p = G.player;
  for (const s of G.shots) {
    if (s.dead) continue;
    s.life -= dt;
    if (s.life <= 0) { s.dead = true; continue; }
    if (s.boomerang) {
      s.age += dt;
      s.travel += Math.hypot(s.vx, s.vy) * dt;
      if (!s.returning && s.travel >= s.range) { s.returning = true; s.vx *= -1; s.vy *= -.55; }
      s.rot += dt * 10;
    }
    if (s.grav) s.vy += s.grav * dt;
    if (s.type === 'seal') {
      s.delay -= dt;
      if (s.delay <= 0 && !s.hit && p && !p.dead && overlap({ x: s.x - s.w / 2, y: s.y - s.h / 2, w: s.w, h: s.h }, p)) {
        s.hit = true; damagePlayer(s.dmg, sign(p.x + p.w / 2 - s.x));
      }
      continue;
    }
    if (s.type === 'shock') {
      const t = 1 - s.life / s.lifeMax;
      s.r = 30 + t * (s.grow || 500);
      s.w = s.r * 2;
      if (!s.hit && p && !p.dead) {
        const d = Math.hypot((p.x + p.w / 2) - s.x, (p.y + p.h - 8) - s.y);
        if (d < s.r && p.y + p.h > GY - 40) { s.hit = true; damagePlayer(s.dmg, sign((p.x + p.w / 2) - s.x)); }
      }
      continue;
    }
    if (s.type === 'beam') {
      if (!s.hit && p && !p.dead) {
        const r = { x: s.x - s.w / 2, y: s.y - s.h / 2, w: s.w, h: s.h };
        if (overlap(r, p)) { s.hit = true; damagePlayer(s.dmg, sign((p.x + p.w / 2) - s.x)); }
      }
      continue;
    }
    s.x += (s.vx || 0) * dt;
    s.y += (s.vy || 0) * dt;
    if (!s.boomerang && s.rot !== undefined && (s.vx || s.vy)) s.rot = Math.atan2(s.vy, s.vx);
    if (s.y > GY + 10 && s.grav) { s.dead = true; fxSpark(s.x, GY - 4, 3, '#ffe3a0'); }
    if (s.friendly) {
      for (const e of G.enemies) {
        if (e.dead || s.hit.has(e.id)) continue;
        const sr = { x: s.x - s.r, y: s.y - s.r, w: s.r * 2, h: s.r * 2 };
        if (overlap(sr, hurtBox(e))) {
          s.hit.add(e.id);
          damageEnemy(e, s.dmg, sign((e.x + e.w / 2) - s.x), false, false);
          healPlayer(14 + p.ownHeal);
          if (s.pierce > 0) s.pierce--;
          else s.dead = true;
          fxRing(s.x, s.y, 'rgba(155,230,242,.8)', 36, 240);
          if (s.dead) break;
        }
      }
      if (G.dummy && !s.hit.has('dummy')) {
        const dr = { x: G.dummy.x, y: G.dummy.y, w: G.dummy.w, h: G.dummy.h };
        if (overlap({ x: s.x - s.r, y: s.y - s.r, w: s.r * 2, h: s.r * 2 }, dr)) {
          s.dead = true; G.dummy.hitT = .2; G.dummy.shakeT = .18;
          dmgText(G.dummy.x + 24, G.dummy.y + 10, String(s.dmg), '#9be6f2', 15);
          fxRing(s.x, s.y, 'rgba(155,230,242,.8)', 36, 220);
          addViewers(1);
        }
      }
    } else if (p && !p.dead) {
      const sr = { x: s.x - s.r, y: s.y - s.r, w: s.r * 2, h: s.r * 2 };
      if (overlap(sr, p)) {
        s.dead = true;
        damagePlayer(s.dmg, sign((p.x + p.w / 2) - s.x));
        fxSpark(s.x, s.y, 5, '#ff9b7a');
      }
    }
    if (s.x < -80 || s.x > G.level.width + 80 || s.life <= 0) s.dead = true;
  }
  G.shots = G.shots.filter(s => !s.dead);
}
function updateDrops(dt) {
  const p = G.player;
  for (const d of G.drops) {
    d.life -= dt;
    d.bob += dt * 4;
    if (!d.grounded) {
      d.vy += 1200 * dt;
      d.x += d.vx * dt; d.y += d.vy * dt;
      if (d.y > GY - 18) { d.y = GY - 18; d.vy = 0; d.grounded = true; d.vx = 0; }
    }
    if (p && !p.dead) {
      const dx = (p.x + p.w / 2) - d.x, dy = (p.y + p.h / 2) - d.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 90) { d.x += dx * dt * 7; d.y += dy * dt * 7; }
      if (dist < 26) {
        d.life = 0;
        if (d.kind === 'milk') { healPlayer(50 + p.milkHeal); }
        else if (d.kind === 'reroll') {
          G.rerollCards = (G.rerollCards || 0) + 1;
          dmgText(d.x, d.y - 20, '+1 刷新卡', '#a9f4dc', 17);
          toast('拾取刷新卡 +1（库存 ' + G.rerollCards + '）· 强化面板按 R 使用，免费次数优先', 3.5);
          fxRing(d.x, d.y, '#a9f4dc', 52, 220);
          Sound.sfx('pickup');
        } else if (d.kind === 'star') { addViewers(12); dmgText(d.x, d.y - 14, '+12 观众', '#ffd894', 12); Sound.sfx('pickup'); }
      }
    }
  }
  G.drops = G.drops.filter(d => d.life > 0);
}
function updateFX(dt) {
  for (const f of G.fx) {
    f.life -= dt;
    if (f.kind === 'spark') {
      f.vy += 500 * dt; f.x += f.vx * dt; f.y += f.vy * dt;
    } else if (f.kind === 'ring') {
      f.r = Math.min(f.max, f.r + f.speed * dt);
    }
  }
  G.fx = G.fx.filter(f => f.life > 0);
  for (const t of G.texts) { t.t -= dt; t.y += t.vy * dt; t.vy *= .92; }
  G.texts = G.texts.filter(t => t.t > 0);
  for (const d of G.danmaku) { d.x += d.vx * dt; d.life -= dt; }
  G.danmaku = G.danmaku.filter(d => d.life > 0);
}
function updateDuel(dt) {
  if (!G.duel) return;
  const p = G.player;
  if (!p || p.dead) return;
  const alive = G.enemies.some(e => e.boss && !e.dead);
  if (!alive && !G.duel.pending) {
    G.duel.pending = true;
    after(1.2, () => {
      const s = G.duel && G.duel.scene;
      G.duel = null;
      if (s && G.mode === 'play' && G.player && !G.player.dead) startScene(s);
    });
  }
}
function startDuel(type, sceneId) {
  Voice.stop();
  G.dlg = null;
  G.mode = 'play';
  const p = G.player;
  const x = clamp((p ? p.x : 500) + 280, 120, G.level.width - 160);
  const e = spawnBoss(type, x, { scene: sceneId });
  G.duel = { scene: sceneId, boss: e };
  showBossBanner(e.name, e.title);
}

/* ---------------- 总更新 ---------------- */
function updateGame(dt) {
  if (G.hitstop > 0) { G.hitstop -= dt; return; }
  G.stageTime += dt; G.stats.time += dt; G.runTime += dt;
  const p = G.player;
  if (!p) return;
  updatePlayer(dt);
  if (G.mode !== 'play') return;
  updateZones(dt);
  for (const e of G.enemies) updateEnemy(e, dt);
  updateShots(dt);
  updateDrops(dt);
  updateFX(dt);
  updateDuel(dt);
  updateSecrets();
  if (G.mode !== 'play') return;
  // 镜头
  const target = clamp(p.x + p.w / 2 - W * .45 + p.face * 32, 0, Math.max(0, G.level.width - W));
  G.camX = lerp(G.camX, target, 1 - Math.pow(.001, dt));
  G.camX = clamp(G.camX, 0, Math.max(0, G.level.width - W));
  // 观众数缓慢漂移
  if (Math.random() < dt * .25) G.viewers += Math.random() < .6 ? 1 : -1;
  G.viewers = Math.max(3, G.viewers);
  G.stats.maxViewers = Math.max(G.stats.maxViewers, G.viewers);
  // Boss 提示
  if (G.bossBanner) { G.bossBanner.t -= dt; if (G.bossBanner.t <= 0) G.bossBanner = null; }
  if (G.zoneLine) { G.zoneLine.t -= dt; if (G.zoneLine.t <= 0) G.zoneLine = null; }
  G.shake = Math.max(0, G.shake - dt * 30);
  G.flash = Math.max(0, G.flash - dt * 2.2);
}

/* ---------------- 渲染世界 ---------------- */
function drawSecretScenery(camX, t) {
  if (!['seedVault', 'lensChamber'].includes(G.level.id)) return;
  const seeds = G.level.id === 'seedVault';
  X.save();
  const shade = X.createLinearGradient(0, 0, 0, GY);
  shade.addColorStop(0, seeds ? 'rgba(15,36,32,.97)' : 'rgba(9,11,31,.98)');
  shade.addColorStop(1, seeds ? 'rgba(24,51,37,.66)' : 'rgba(13,23,51,.76)');
  X.fillStyle = shade; X.fillRect(0, 0, W, GY);
  for (let i = -1; i < 7; i++) {
    const x = i * 180 - camX * .2 % 180;
    seg(x, 40, x, GY, seeds ? '#48665a' : '#36465e', 8);
    seg(x, 60, x + 180, 30, seeds ? '#709583' : '#466086', 4);
    fillRR(x + 18, 140, 144, 200, 7, seeds ? '#182e24' : '#111d37');
    strokeRR(x + 18, 140, 144, 200, 7, seeds ? '#668566' : '#5374a4', 1);
    if (seeds) {
      for (let row = 0; row < 3; row++) {
        seg(x + 22, 196 + row * 60, x + 156, 196 + row * 60, '#94a377', 3);
        for (let j = 0; j < 4; j++) {
          const px = x + 40 + j * 31, py = 179 + row * 60;
          fillRR(px - 9, py - 19, 18, 31, 4, 'rgba(186,215,140,.28)');
          fillRR(px - 10, py - 22, 20, 5, 2, '#8ca66d');
          circ(px, py, 2.7, '#efcb7c'); seg(px, py, px + 3, py - 10, '#9dc56b', 1.5);
        }
      }
    } else {
      circ(x + 90, 240, 52, null, '#6d88b0', 1.5);
      circ(x + 90, 240, 32, null, '#7284c8', 2);
      for (let j = 0; j < 6; j++) {
        const angle = t * .3 + j * Math.PI / 3;
        seg(x + 90, 240, x + 90 + Math.cos(angle) * 50, 240 + Math.sin(angle) * 50, '#456791', 1);
      }
      mono('ERROR ' + (i + 3) + '.047', x + 90, 314, 9, '#97cef3', 'center');
    }
  }
  txt(seeds ? '种 子 封 存 库 / 1999' : 'ZERO · 零号误差矩阵', W / 2, 108, 22, seeds ? '#b7cf98' : '#a4baf0', 'center', 700);
  X.restore();
}
function renderWorld() {
  const t = G.time;
  const camX = G.camX;
  X.save();
  if (G.shake > 0) X.translate(rnd(-G.shake, G.shake) * .5, rnd(-G.shake, G.shake) * .5);
  drawBG(G.level.theme, camX, t);
  drawSecretScenery(camX, t);
  X.save();
  X.translate(-camX, 0);
  drawGround(G.level, camX, t);
  drawPlatforms(G.level, t);
  drawSigns(G.level, t);
  drawSecretDoor();
  // 区域屏障
  for (const z of G.zones) if (z.active) drawBarrierZone(z, t);
  // 传送门
  if (G.level.portal) drawPortal(G.level.portal.x, t);
  // NPC / 木桩
  if (G.level.npc) drawHubLi(G.level.npc.x, t);
  if (G.dummy) drawDummy(G.dummy, t);
  // Boss 预警线
  if (G.boss && G.boss.state === 'windup' && G.boss.pattern === 'beam') {
    X.save(); X.globalAlpha = .35 + Math.sin(t * 22) * .2;
    X.fillStyle = '#ff8b7a'; X.fillRect(G.boss.warnX - 15, 0, 30, GY);
    X.globalAlpha = .9; X.fillRect(G.boss.warnX - 2, 0, 4, GY);
    X.restore();
  }
  // 掉落
  for (const d of G.drops) drawDrop(d, t);
  // 敌人
  for (const e of G.enemies) {
    if (e.dead) continue;
    if (e.x + e.w < camX - 180 || e.x > camX + W + 180) continue;
    drawEnemy(e, t);
    if (G.debug) {
      X.save(); X.strokeStyle = 'rgba(255,90,90,.5)'; X.strokeRect(e.x, e.y, e.w, e.h); X.restore();
    }
  }
  // 玩家
  const p = G.player;
  if (p && !p.dead) {
    drawNaiba(p, t);
    if (G.debug) { X.save(); X.strokeStyle = 'rgba(90,255,160,.6)'; X.strokeRect(p.x, p.y, p.w, p.h); X.restore(); }
  } else if (p && p.dead) {
    X.save(); X.globalAlpha = Math.max(0, 1 - p.deadT * .7);
    drawNaiba(p, t); X.restore();
  }
  // 弹幕
  for (const s of G.shots) drawShot(s, t);
  // 特效
  for (const f of G.fx) drawFXItem(f, t);
  // 伤害数字
  for (const tx of G.texts) {
    X.save(); X.globalAlpha = clamp(tx.t / tx.max * 1.4, 0, 1);
    txt(tx.text, tx.x, tx.y, tx.size, tx.col, 'center', 800);
    X.restore();
  }
  // 弹幕评论（屏幕坐标）
  X.restore();
  for (const d of G.danmaku) {
    X.save(); X.globalAlpha = clamp(d.life / 2, 0, .8);
    const w = Math.max(70, d.text.length * 13 + 20);
    fillRR(d.x - w / 2, d.y - 10, w, 20, 10, 'rgba(8,9,15,.55)');
    txt(d.text, d.x, d.y + 4, 10, d.col, 'center', 500);
    X.restore();
  }
  X.restore();
  // 天气
  drawWeather(G.level.theme, t);
  // 闪光
  if (G.flash > 0) {
    X.save(); X.globalAlpha = Math.min(.65, G.flash); X.fillStyle = '#fff7e8'; X.fillRect(0, 0, W, H); X.restore();
  }
  if (G.debug && p) {
    mono(`x:${Math.round(p.x)} y:${Math.round(p.y)} cam:${Math.round(camX)} enemies:${G.enemies.length}`, 12, 524, 9, 'rgba(155,230,242,.8)');
  }
}
function drawPortal(x, t) {
  X.save(); X.translate(x, GY);
  const pulse = .55 + Math.sin(t * 2) * .15;
  X.save(); X.globalAlpha = .12 * pulse; X.fillStyle = '#f3b45c';
  X.beginPath(); X.ellipse(0, -70, 70, 96, 0, 0, Math.PI * 2); X.fill(); X.restore();
  X.strokeStyle = `rgba(243,180,92,${pulse})`; X.lineWidth = 3;
  X.beginPath(); X.arc(0, -70, 52, Math.PI, Math.PI * 2); X.stroke();
  X.beginPath(); X.arc(0, -70, 52, 0, Math.PI); X.stroke();
  X.strokeStyle = 'rgba(255,245,228,.35)'; X.lineWidth = 1.2;
  for (let i = 0; i < 3; i++) {
    X.beginPath(); X.ellipse(0, -70, 52 - i * 8, 74 - i * 10, 0, 0, Math.PI * 2); X.stroke();
  }
  txt('去寒武大学', 0, -150, 12, '#ffd9a8', 'center', 700);
  txt('→', 0, -132 + Math.sin(t * 4) * 3, 16, '#f3b45c', 'center', 800);
  X.restore();
}
function drawHubLi(x, t) {
  X.save();
  drawLiNpc(x, GY, t, { scale: 1.04 });
  const bx = x + 34, by = GY - 128;
  X.save(); X.globalAlpha = .88;
  fillRR(bx - 4, by - 18, 150, 30, 8, 'rgba(255,248,230,.9)');
  X.beginPath(); X.moveTo(bx + 6, by + 12); X.lineTo(bx - 4, by + 22); X.lineTo(bx + 18, by + 12); X.fillStyle = 'rgba(255,248,230,.9)'; X.fill();
  txt('今天资料全部整理齐全', bx + 71, by + 2, 9, '#4a3a2c', 'center', 600);
  X.restore();
  // 手机直播
  X.save(); X.globalAlpha = .7;
  circ(x - 38, GY - 90, 2, '#ff5d5d');
  mono('LIVE 3', x - 33, GY - 87, 7, 'rgba(255,140,120,.8)');
  X.restore();
  X.restore();
}
function drawDrop(d, t) {
  const bob = Math.sin(d.bob) * 3;
  if (d.kind === 'milk') {
    X.save(); X.globalAlpha = .25; circ(d.x, d.y - 10, 16, '#fff1c9'); X.restore();
    drawMilkBottle(d.x, d.y - 4 + bob, Math.sin(t * 2) * .1, .72, true);
  } else if (d.kind === 'reroll') {
    const y = d.y - 8 + bob;
    X.save(); X.globalAlpha = .24 + Math.sin(t * 4) * .06;
    circ(d.x, y, 23, '#a9f4dc'); X.restore();
    fillRR(d.x - 12, y - 16, 24, 32, 4, '#163b38');
    strokeRR(d.x - 12, y - 16, 24, 32, 4, '#a9f4dc', 2);
    txt('R', d.x, y + 5, 18, '#d5fff0', 'center', 900);
    txt('刷新卡', d.x, y - 23, 11, '#a9f4dc', 'center', 700);
  } else if (d.kind === 'star') {
    X.save(); X.translate(d.x, d.y - 6 + bob); X.rotate(t * 2);
    X.fillStyle = '#ffd46f'; X.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI / 2 + i * Math.PI * 2 / 5;
      const b = a + Math.PI / 5;

      X.lineTo(Math.cos(b) * 4.5, Math.sin(b) * 4.5);

    X.closePath(); X.fill();
    X.restore();
  }
}
function drawFXItem(f, t) {
  X.save();
  const a = clamp(f.life / (f.lifeMax || .5), 0, 1);
  X.globalAlpha = a;
  if (f.kind === 'nova') {
    X.globalCompositeOperation = 'lighter';
    const r = Math.max(1, f.radius * (1 - a));
    const glow = X.createRadialGradient(f.x, f.y, r * .65, f.x, f.y, r);
    glow.addColorStop(0, 'transparent'); glow.addColorStop(1, f.col);
    X.globalAlpha = a * .22; circ(f.x, f.y, r, glow);
    X.globalAlpha = a * .85; X.strokeStyle = f.col; X.lineWidth = 3 + a * 7;
    X.beginPath(); X.arc(f.x, f.y, r, 0, Math.PI * 2); X.stroke();
    for (let i = 0; i < 12; i++) {
      const angle = i * Math.PI / 6 + t;
      seg(f.x + Math.cos(angle) * r * .7, f.y + Math.sin(angle) * r * .7,
        f.x + Math.cos(angle) * r, f.y + Math.sin(angle) * r, '#fff6cf', 1.5);
    }
  } else if (f.kind === 'spark') {
    X.globalCompositeOperation = 'lighter';
    seg(f.x - (f.vx || 0) * .02, f.y - (f.vy || 0) * .02, f.x, f.y, f.col, f.size || 2);
    circ(f.x, f.y, (f.size || 2) * .6, '#fff8e9');
  } else if (f.kind === 'ring') {
    X.strokeStyle = f.col; X.lineWidth = 2;
    X.beginPath(); X.ellipse(f.x, f.y, f.r, f.r * .6, 0, 0, Math.PI * 2); X.stroke();
  } else if (f.kind === 'slash') {
    X.translate(f.x, f.y); X.scale(f.face || 1, 1); X.translate(-f.x, -f.y);
    X.globalCompositeOperation = 'lighter';
    X.strokeStyle = f.size > 45 ? '#ffd588' : '#a1eaff'; X.lineWidth = f.size > 45 ? 5 : 3.5;
    X.beginPath();
    X.arc(f.x, f.y, f.size, -.9, .9);
    X.stroke();
    X.globalAlpha *= .35; X.lineWidth *= 2.4;
    X.beginPath(); X.arc(f.x, f.y, f.size + 6, -.75, .75); X.stroke();
  } else if (f.kind === 'sigil') {
    txt(f.text, f.x, f.y, 14, f.col, 'center', 800);
  }
  X.restore();
}

/* ---------------- 调试接口 ---------------- */
window.NW = {

  startScene: (id) => startScene(id),

  showEnding: (id) => showEnding(id),
  unlockAll: () => { SAVE.endings = [1, 2, 3, 4, 5, 6]; persistSave(); },
  hurt: (n) => damagePlayer(n, 1),
  killBoss: () => { if (G.boss) damageEnemy(G.boss, 99999, 1, true, false); },

  give: () => { G.player.maxhp += 100; G.player.hp = G.player.maxhp; G.player.atkBonus += 20; G.player.crit = .5; },
  god: () => { G.player.inv = 9999; }
};

function startScene(id) {
  Voice.stop();
  const sc = SCENES[id];
  if (!sc) { finishDialogue(true); return; }
  if (sc.stage && (!G.level || G.level.id !== sc.stage)) {
    G.dlg = null;
    G.mode = 'play';
    fadeTo(() => {
      loadStage(sc.stage);
      startScene(id);
    }, sc.loadText || '');
    return;
  }
  G.dlg = {
    id, i: 0, step: null, chars: [], shown: 0, t: 0, sfxT: 0,
    choice: null, selected: 0, promptChars: [], promptShown: 0
  };
  G.mode = 'dialogue';
  G.bossBanner = null;
  G.zoneLine = null;
  G.transitionLock = true;
  G.dlgRects = [];
  if (sc.music) Sound.music(sc.music);
  if (sc.onStart) { try { sc.onStart(); } catch (e) { console.error(e); } }
  Sound.sfx('page');
  enterStep();
}
function findStepIndex(scene, to) {
  if (typeof to === 'number') return clamp(to, 0, scene.steps.length);
  const i = scene.steps.findIndex(st => st.label === to);
  return i >= 0 ? i : scene.steps.length;
}
function optOK(req) {
  if (!req) return true;
  const f = G.flags || {};
  for (const k in req) {
    const have = k === 'viewers' ? (G.viewers || 0) : (f[k] || 0);
    if (have < req[k]) return false;
  }
  return true;
}
function enterStep() {
  const d = G.dlg;
  if (!d) return;
  const sc = SCENES[d.id];
  if (!sc) { finishDialogue(true); return; }
  Voice.stop();
  let guard = 0;
  while (d.i < sc.steps.length && guard++ < 200) {
    const st = sc.steps[d.i] || {};
    if (st.set) Object.assign(G.flags, st.set);
    if (st.do) { try { st.do(); } catch (e) { console.error(e); } }
    if (!G.dlg || G.dlg !== d || G.mode !== 'dialogue') return;
    if (st.go) { startScene(st.go); return; }
    if (st.ending) { showEnding(st.ending); return; }
    if (st.end) { finishDialogue(true); return; }
    if (st.duel) {
      const boss = st.duel, next = st.next || null;
      G.dlg = null;
      finishDialogue(false);
      startDuel(boss, next);
      return;
    }
    if (st.upgrade) {
      let next = null;
      if (typeof st.upgrade === 'string') next = st.upgrade;
      else if (st.next === 'route') next = G.flags.route === 'server' ? 'serverIntro' : 'hallIntro';
      else next = st.next || null;
      G.dlg = null;
      offerUpgrade(next);
      return;
    }
    if (st.music) Sound.music(st.music);
    if (st.choice) {
      const opts = st.choice.filter(o => optOK(o.require));
      if (!opts.length) { d.i++; continue; }
      d.step = st;
      d.choice = opts;
      d.selected = 0;
      d.promptChars = Array.from(st.prompt || '');
      d.promptShown = 0;
      d.chars = [];
      d.shown = 0;
      d.t = 0;
      d.sfxT = 0;
      return;
    }
    if (st.text) {
      d.step = st;
      d.choice = null;
      d.chars = Array.from(st.text);
      d.shown = 0;
      d.t = 0;
      d.sfxT = 0;

  Sound.sfx('choice');

  if (opt.go) { startScene(opt.go); return; }
  if (opt.to != null) { d.i = findStepIndex(SCENES[d.id], opt.to); d.step = null; enterStep(); return; }

    if (Math.floor(d.shown) > before && d.shown < d.chars.length) {
      d.sfxT += dt;

    const n = d.choice.length;
    if (Input.hit('up') || Input.hit('left')) { d.selected = (d.selected + n - 1) % n; Sound.sfx('ui'); }
    if (Input.hit('down') || Input.hit('right')) { d.selected = (d.selected + 1) % n; Sound.sfx('ui'); }
    for (let k = 0; k < Math.min(3, n); k++) {

    }

  const x0 = (W - (cw * 3 + gapX * 2)) / 2, y0 = 132;
  const hints = {
    1: '邀请独立见证＋天文台校准核验，进入公开听证',
    2: '提前借宿或卖设备／帮工换住处，再放下公众身份',
    3: '签合同且不反悔，完成移交战；工牌决定冷酷或后悔',
    4: '先约定谈判权限，天文台听取密约，接受孙阵营接台',
    5: '深圳带走账本＋承诺公共排班，兑现社区重建',
    6: '校园接力＋完整原件／档案镜像＋天文台核验，接受失控'
  };
  for (let id = 1; id <= 6; id++) {
    const data = ENDINGS[id];
    const unlocked = SAVE.endings.includes(id);
    const col = (id - 1) % 3, row = Math.floor((id - 1) / 3);
    const x = x0 + col * (cw + gapX), y = y0 + row * (ch + gapY);
    const hover = unlocked && InsideMouse(x, y, cw, ch);
    fillRR(x, y, cw, ch, 10, unlocked ? 'rgba(15,16,24,.96)' : 'rgba(10,11,17,.88)');
    strokeRR(x, y, cw, ch, 10, hover ? 'rgba(255,217,154,.8)' : unlocked ? 'rgba(243,180,92,.4)' : 'rgba(255,245,228,.10)', hover ? 2 : 1.2);
    // 缩略图
    const tw = 122, th = ch - 16, tx = x + 8, ty = y + 8;
    X.save();
    rrPath(tx, ty, tw, th, 7); X.clip();
    if (unlocked) {
      X.save(); X.translate(tx, ty); X.scale(tw / W, th / H);
      drawEndingArt(id, G.time);
      X.restore();
      const og = X.createLinearGradient(0, ty + th * .5, 0, ty + th);
      og.addColorStop(0, 'rgba(10,10,15,0)'); og.addColorStop(1, 'rgba(10,10,15,.85)');
      X.fillStyle = og; X.fillRect(tx, ty, tw, th);
    } else {
      X.fillStyle = 'rgba(6,7,11,.92)'; X.fillRect(tx, ty, tw, th);
      X.save(); X.globalAlpha = .26;
      for (let sy = ty + 8; sy < ty + th - 4; sy += 6) seg(tx + 4, sy, tx + tw - 4, sy, '#f3b45c', .6);
      X.restore();
      txt('?', tx + tw / 2, ty + th / 2 + 16, 46, 'rgba(243,180,92,.28)', 'center', 900);
      mono('LOCKED', tx + tw / 2, ty + th - 14, 8, 'rgba(243,180,92,.35)', 'center');
    }
    X.restore();
    strokeRR(tx, ty, tw, th, 7, 'rgba(255,255,255,.10)', 1);
    const textX = x + 142;
    if (unlocked) {
      txt('ENDING ' + String(id).padStart(2, '0'), textX, y + 26, 8.5, 'rgba(243,180,92,.72)', 'left', 600);
      txt(data.title, textX, y + 50, 18, '#fff5e4', 'left', 800);
      txt(data.tag.split('·')[1] ? data.tag.split('·')[1].trim() : data.tag, textX, y + 68, 9, 'rgba(255,245,228,.5)', 'left', 500);
      const fl = wrapText(data.lines[0], cw - 154, 9, 500);
      for (let k = 0; k < Math.min(3, fl.length); k++) txt(fl[k], textX, y + 92 + k * 13, 9, 'rgba(235,226,212,.62)', 'left', 500);
      txt('点击重读 →', x + cw - 14, y + ch - 12, 8.5, 'rgba(255,217,154,.55)', 'right', 500);
      addClick(x, y, cw, ch, () => { G.endingFrom = 'gallery'; showEnding(id); });
    } else {
      txt('ENDING ' + String(id).padStart(2, '0'), textX, y + 26, 8.5, 'rgba(243,180,92,.35)', 'left', 600);
      txt('未收录', textX, y + 50, 18, 'rgba(255,245,228,.32)', 'left', 800);
      const hl = wrapText('条件：' + hints[id], cw - 154, 9.2, 500);
      for (let k = 0; k < Math.min(4, hl.length); k++) txt(hl[k], textX, y + 74 + k * 13.5, 9.2, 'rgba(255,245,228,.42)', 'left', 500);
      txt('完成对应路线后解锁', x + cw - 14, y + ch - 12, 8, 'rgba(255,245,228,.25)', 'right', 500);
    }
  }
  uiButton(W / 2 - 90, 486, 180, 32, '返回', () => { G.mode = 'title'; Sound.sfx('ui'); });
}

/* ---------------- 点击与主循环 ---------------- */
function handleCanvasClick(x, y) {
  Sound.unlock();
  if (G.fade.on && G.fade.a > .35) return;
  if (G.clickRectsMode === G.mode) {
    for (let i = G.clickRects.length - 1; i >= 0; i--) {
      const r = G.clickRects[i];
      if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) {
        Sound.sfx('ui');
        r.fn();
        return;
      }
    }
  }
  if (G.mode === 'dialogue' && G.dlg && !G.dlg.choice) advanceDialogue();
}
function updateCursor() {
  let pointer = false;
  if (G.clickRectsMode === G.mode) {
    for (const r of G.clickRects) if (InsideMouse(r.x, r.y, r.w, r.h)) { pointer = true; break; }
  }
  if (!pointer && G.mode === 'dialogue' && G.dlg && !G.dlg.choice) pointer = true;
  const cur = pointer ? 'pointer' : 'default';
  if (CV.style.cursor !== cur) CV.style.cursor = cur;
}
function updateTouchUI() {
  const tu = document.getElementById('touchUI');
  if (!tu) return;
  const show = G.mode === 'play';
  if (!show && document.body.classList.contains('touch')) { Input.down.delete('left'); Input.down.delete('right'); }
  const disp = show ? '' : 'none';
  if (tu.style.display !== disp) tu.style.display = disp;
}
function render() {
  G.clickRects = [];
  G.clickRectsMode = G.mode;
  X.setTransform(1, 0, 0, 1, 0, 0);
  X.clearRect(0, 0, W, H);
  if (G.mode === 'title') {
    drawTitle();
  } else if (G.mode === 'ending') {
    drawEnding();
  } else if (G.mode === 'gallery') {
    drawGallery();
  } else if (G.mode === 'help') {
    drawHelp();
  } else if (G.level) {
    renderWorld();
    if (G.mode === 'play') {
      drawHUD();
      drawStageIntro();
      if (G.player && G.player.dead) {
        X.save(); X.globalAlpha = .18 + Math.sin(G.time * 3) * .05;
        X.fillStyle = '#ff5d5d'; X.fillRect(0, 0, W, H); X.restore();
      }
    } else if (G.mode === 'dialogue') {
      drawDialogue(G.time);
    } else if (G.mode === 'pause') {
      drawHUD();
      drawPause();
    } else if (G.mode === 'upgrade') {
      drawHUD();
      drawUpgrade();
    } else if (G.mode === 'gameover') {
      drawGameOver();
    }
  } else {
    drawTitleBg(G.time);
  }
  if (G.mode === 'play' || G.mode === 'dialogue') drawToast();
  drawFade();
  updateCursor();
  updateTouchUI();
}
let lastFrameTime = 0;
function frame(ts) {
  const now = ts / 1000;
  let dt = lastFrameTime ? now - lastFrameTime : 0;
  lastFrameTime = now;
  dt = clamp(dt, 0, .05);
  G.time += dt;
  updateFade(dt);
  if (G.stageIntro > 0) G.stageIntro = Math.max(0, G.stageIntro - dt);
  if (G.toastT > 0) G.toastT = Math.max(0, G.toastT - dt);
  if (G.mode !== 'play' && Input.hit('mute')) toggleMute();
  const fadingOut = G.fade.on && (G.fade.phase === 1 || G.fade.pending);
  if (!fadingOut) {
    switch (G.mode) {
      case 'title': updateTitle(dt); break;
      case 'dialogue': updateDialogue(dt); break;
      case 'play':
        updateGame(dt);
        updateTimers(dt);
        break;
      case 'pause': updatePause(dt); break;
      case 'help': updateHelp(dt); break;
      case 'upgrade': updateUpgrade(dt); break;
      case 'gameover': updateGameOver(dt); break;
      case 'ending': updateEnding(dt); break;
      case 'gallery': updateGallery(dt); break;
    }
  }
  render();
  Input.endFrame();
  requestAnimationFrame(frame);
}
function boot() {
  Input.init();
  Sound.setMuted(!!SAVE.muted);
  G.mode = 'title';
  G.title.menu = 0;
  requestAnimationFrame(frame);
}
boot();
</script>
